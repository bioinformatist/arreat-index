[workspace]
members = ["crates/arreat-core", "crates/arreat-app", "crates/arreat-data"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "4.5.46", features = ["derive"] }
csv = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tar = "0.4.44"
thiserror = "2.0.16"
