name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo +1.97.1 fmt --all -- --check
      - run: cargo +1.97.1 check --workspace --all-targets --locked
      - run: cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.97.1 test --workspace --all-targets --locked
